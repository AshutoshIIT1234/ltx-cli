[project]
name = "ltx-cli"
version = "0.1.0"
description = "A reproducible CLI for running LTX-2 video generation with presets, configs, and smart defaults."
authors = [
    { name = "Ashutosh Kumar Tripathi", email = "tripathiashu342@gmail.com" }
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.9"
keywords = ["ltx", "video-generation", "ai", "cli", "diffusion", "presets"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Video",
]

dependencies = [
    "typer[all]>=0.9.0",
    "pyyaml>=6.0",
    "torch>=2.0",
    "rich>=13.0",
    "diffusers>=0.25.0",
    "transformers>=4.30.0",
    "accelerate>=0.20.0",
    "sentencepiece>=0.1.99",
    "protobuf>=3.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
]

[project.scripts]
ltx = "ltx.cli:app"

[project.urls]
Homepage = "https://github.com/AshutoshIIT1234/ltx-cli"
Repository = "https://github.com/AshutoshIIT1234/ltx-cli"
Issues = "https://github.com/AshutoshIIT1234/ltx-cli/issues"

[tool.hatch.build.targets.wheel]
packages = ["ltx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
